name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Disable analytics/telemetry prompts
        run: |
          flutter config --no-analytics
          dart --disable-analytics
      - run: flutter pub get
      - name: Verify core has no Flutter imports
        run: |
          if grep -r "package:flutter" lib/core/ 2>/dev/null; then
            echo "ERROR: lib/core must not import Flutter"
            exit 1
          fi
      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs --verbose
        timeout-minutes: 10
      - run: flutter analyze --no-fatal-infos
      - run: flutter test