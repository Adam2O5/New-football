name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Disable analytics/telemetry prompts
        run: |
          flutter config --no-analytics
          dart --disable-analytics
      - run: flutter pub get
      - name: Verify core has no Flutter imports
        run: bash ./scripts/check_core_no_flutter.sh
      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs --verbose
        timeout-minutes: 10
      - run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: pwsh -NoProfile -NonInteractive -File ./scripts/test.ps1
