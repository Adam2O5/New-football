name: new_football
description: Football manager app with NBA-style league structure.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  glados: 1.1.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/new-football-background.png